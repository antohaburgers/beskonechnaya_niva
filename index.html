<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Бесконечная Нива v1.20.8</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#101418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Нива" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    :root{
      --panel:#1f2730;
      --panel2:#2a3440;
      --line:#5f6b7b;
      --text:#f2f6fb;
      --green:#88dd67;
      --yellow:#ffd34d;
    }
    *{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;height:100%;overflow:hidden;background:#101418;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      touch-action:none;
    }
    body{display:flex;align-items:center;justify-content:center}
    .wrap{
      position:relative;
      width:min(100vw,100vh * 16 / 9);
      aspect-ratio:16/9;
      overflow:hidden;
      background:#0a0e12;
      box-shadow:0 0 0 2px rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.45);
    }
    canvas{
      width:100%;height:100%;display:block;
      image-rendering:auto;
    }
    .btn{
      position:absolute;z-index:10;
      border:2px solid #6d7788;
      background:rgba(255,255,255,.07);
      color:#fff;font-weight:800;
      box-shadow:0 8px 18px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.05);
      display:flex;align-items:center;justify-content:center;text-align:center;
      touch-action:none;
    }
    .btn.arrow{
      left:2%;width:9%;min-width:46px;height:22%;border-radius:16px;
      font-size:min(4vw,30px);
    }
    .btn.up{top:33%}
    .btn.down{top:58%}
    .btn.low{
      right:2%;top:43%;
      width:10%;min-width:62px;aspect-ratio:1/1;
      border-radius:999px;flex-direction:column;line-height:1.03;padding:.45rem;
      font-size:min(1.5vw,12px);
    }
    .btn.low.active{
      border-color:#97ee7a;
      box-shadow:0 0 0 3px rgba(136,221,103,.16),0 8px 18px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.05);
    }
    .btn.beer{
      right:2%;
      top:6%;
      width:10%;min-width:62px;
      aspect-ratio:1/1;
      border-radius:999px;
      padding:.45rem;
      border-color:#c69a4c;
      background:linear-gradient(#76511f,#38240d);
      color:#ffe9a8;font-size:min(1.5vw,12px);line-height:1.05;
      display:none;
    }
    #baldezhMessage{
      position:absolute;left:50%;top:20%;transform:translateX(-50%);
      z-index:28;display:none;pointer-events:none;
      color:#ffd34d;font:900 min(6vw,58px)/1 monospace;
      letter-spacing:.06em;text-shadow:4px 4px 0 #3b2108,0 0 16px rgba(255,190,50,.65);
      animation:baldezhPulse .35s steps(2,end) infinite;
    }
    @keyframes baldezhPulse{
      50%{transform:translateX(-50%) scale(1.06);color:#fff1a8}
    }
    .gear{font-size:min(4vw,27px);margin-bottom:.25rem}

    #startPanel{
      position:absolute;
      right:8%;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }
    #startTitle{
      display:none;
    }
    #startBtn{
      appearance:none;
      border:2px solid rgba(255,255,255,.72);
      border-radius:12px;
      padding:11px 26px;
      background:rgba(255,255,255,.08);
      color:#fff;
      font:800 18px/1 monospace;
      cursor:pointer;
      text-shadow:2px 2px 0 #000;
      box-shadow:0 5px 12px rgba(0,0,0,.30), inset 0 0 12px rgba(255,255,255,.10);
      backdrop-filter:blur(3px);
    }
    #startBtn:active{
      transform:translateY(1px);
      background:rgba(0,0,0,.26);
    }

    #selectCarBtn{
      appearance:none;
      border:2px solid rgba(255,255,255,.55);
      border-radius:12px;
      padding:8px 18px;
      background:rgba(35,42,48,.45);
      color:#fff;
      font:800 16px/1 monospace;
      cursor:pointer;
      text-shadow:2px 2px 0 #000;
      box-shadow:0 5px 12px rgba(0,0,0,.35), inset 0 0 12px rgba(255,255,255,.06);
      backdrop-filter:blur(3px);
    }
    #carSelectPanel{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;
      background:radial-gradient(circle at 50% 30%,#26343d 0,#12181d 55%,#090d10 100%);color:#f2f6fb;text-align:center}
    #startScreen.car-select-mode{background:none}
    #startScreen.car-select-mode #startPanel{display:none}
    #startScreen.car-select-mode #carSelectPanel{display:flex}
    #carSelectTitle{font:900 30px/1 monospace;letter-spacing:.08em;margin-bottom:16px;text-shadow:3px 3px 0 #000}
    #carSelectName{font:900 25px/1 monospace;color:#ffd34d;margin:5px 0 3px}
    #carSelectSub{font:700 13px/1 monospace;color:#aeb9c2;margin-bottom:8px}
    #carPreviewWrap{position:relative;width:min(50vw,450px);height:min(20vw,170px);display:flex;align-items:center;justify-content:center;margin:2px 0 12px}
    #carPreviewWrap::before{content:'';position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);width:min(126vw,1080px);height:min(26.4vw,228px);border-radius:50%;background:radial-gradient(ellipse at center, rgba(180,180,180,.78) 0%, rgba(110,110,110,.52) 34%, rgba(40,40,40,.65) 62%, rgba(0,0,0,.92) 100%);filter:blur(3px);z-index:0;pointer-events:none}
    #carPreview{position:relative;z-index:1;width:min(46vw,410px);height:min(18vw,145px);object-fit:contain;image-rendering:auto;filter:drop-shadow(0 12px 8px rgba(0,0,0,.55));margin:0}
    .carSelectRow{display:flex;gap:18px;align-items:center}
    .carNav,.carChoose,.carBack{appearance:none;border:2px solid #77818d;border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font:900 18px/1 monospace;padding:12px 18px;cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,.35)}
    .carNav{font-size:28px;padding:7px 16px}
    .carChoose{border-color:#c29a54;background:rgba(255,255,255,.07);min-width:160px}
    .carBack{font-size:13px;padding:9px 16px;margin-top:14px;color:#cbd3d9}

  
    #restartBtn{
      position:absolute;
      left:50%;
      top:31%;
      transform:translateX(-50%);
      z-index:30;
      display:none;
      appearance:none;
      border:3px solid #b98a53;
      border-radius:12px;
      padding:14px 30px;
      background:#d7a349;
      color:#1d160d;

<script>
(() => {
  const startScreen = document.getElementById("startScreen");
  const startBtn = document.getElementById("startBtn");
  const selectCarBtn = document.getElementById("selectCarBtn");
  const carSelectPanel = document.getElementById("carSelectPanel");
  const carSelectName = document.getElementById("carSelectName");
  const carSelectSub = document.getElementById("carSelectSub");
  const carPreview = document.getElementById("carPreview");
  const carPrev = document.getElementById("carPrev");
  const carNext = document.getElementById("carNext");
  const carChoose = document.getElementById("carChoose");
  const carBack = document.getElementById("carBack");
  const restartBtn = document.getElementById("restartBtn");
  const mainMenuBtn = document.getElementById("mainMenuBtn");
  const gameOverActions = document.getElementById("gameOverActions");
  let gameOverSince = null;
  function updateGameOverActions(now){
    const gameOver=state.started && (state.fuel<=0 || state.hp<=0);
    if(!gameOver) gameOverSince=null;
    else if(gameOverSince===null) gameOverSince=now;
    const visible=gameOver && now-gameOverSince>=2000;
    gameOverActions.style.display=visible?'flex':'none';
    restartBtn.style.display=mainMenuBtn.style.display=visible?'block':'none';
  }
  const pauseBtn = document.getElementById("pauseBtn");
  const beerBtn = document.getElementById("beerBtn");
  const baldezhMessage = document.getElementById("baldezhMessage");
  if(pauseBtn) pauseBtn.style.display = "none";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width;
  const H = canvas.height;

  // Vehicle registry: all cars intentionally share the existing Niva physics.
  const cars = {
    niva:{name:"ВАЗ 2121 4х4", sprite:null, drawWidth:310, drawHeight:103},
    uaz:{name:"УАЗ Hunter", sprite:null, drawWidth:442, drawHeight:166*442/497},
    jimny:{name:"Suzuki Jimny", sprite:null, drawWidth:446, drawHeight:149}
  };
  const carOrder = ["niva","uaz","jimny"];
  const carStats = {
    niva:{
      damageMultiplier:1,fuelUse:1,mudLowKmh:20,failureChance:1/50,hydroChance:1/30,
      fallSpeed:0.75,fallLimit:0.55,pivotX:0,pivotY:0
    },
    uaz:{
      damageMultiplier:0.7,fuelUse:0.7,mudLowKmh:35,failureChance:1/100,hydroChance:0,
      fallSpeed:0.62,fallLimit:0.42,pivotX:0,pivotY:0
    },
    jimny:{
      damageMultiplier:1.1,fuelUse:1,mudLowKmh:25,failureChance:1/120,hydroChance:1/35,
      fallSpeed:0.38,fallLimit:0.30,pivotX:1,pivotY:5
    }
  };
  function getCarStats(){ return carStats[selectedCarId] || carStats.niva; }
  // HP is 0–100%; ordinary damage and drivetrain wear use Niva-relative multipliers.
  function applyCarDamage(amount){ state.hp=Math.max(0,state.hp-amount*getCarStats().damageMultiplier); }
  // Compensates for transparent padding in the raster sprites.
  // Alpha bounds: Niva 240x82 x=41..202 y=0..81; UAZ 345x115 x=75..270 y=2..112;
  // Jimny 310x103 x=86..216 y=12..88. Physics and collision geometry stay Niva-based.
  const carSpritePlacement = {
    niva:{x:0,lift:0},
    // Visible length: (162/240*310)*1.2 ~= 251 px; preserve sprite proportions.
    // Align alpha-bound centre and tyre baseline with the Niva.
    uaz:{x:(41+162/2)/240*310-173/345*cars.uaz.drawWidth,
      lift:113/115*cars.uaz.drawHeight-103},
    jimny:{x:-60,lift:26}
  };
  let selectedCarId = "niva";
  try{ selectedCarId = localStorage.getItem("beskonechnayaNivaCar") || "niva"; }catch(e){}
  if(!cars[selectedCarId]) selectedCarId="niva";
  let carSelectIndex = carOrder.indexOf(selectedCarId);

  // Engine sound is synthesized with Web Audio instead of an <audio> file.
  // This is much more reliable in iOS/ChatGPT/browser previews.
  let engineCtx = null;
  let engineMaster = null;
  let engineFilter = null;
  let engineOsc1 = null;
  let engineOsc2 = null;
  let engineOsc3 = null;
  let engineRattle = null;
  let engineRattleFilter = null;
  let engineRattleGain = null;
  let enginePulse = null;
  let enginePulseGain = null;


  function makeNoiseBuffer(duration = 0.18){
    if(!engineCtx) return null;
    const length = Math.max(1, Math.floor(engineCtx.sampleRate * duration));
    const buffer = engineCtx.createBuffer(1, length, engineCtx.sampleRate);
    const data = buffer.getChannelData(0);

    let smooth = 0;
    for(let i = 0; i < length; i++){
      const white = Math.random() * 2 - 1;
      smooth = smooth * 0.65 + white * 0.35;
      data[i] = white * 0.65 + smooth * 0.35;
    }
    return buffer;
  }

  function playRockHit(big = false){
    if(!engineCtx) return;
    const now = engineCtx.currentTime;

    // Sharp stone crack / suspension clunk.
    const master = engineCtx.createGain();
    master.gain.setValueAtTime(big ? 0.30 : 0.20, now);
    master.gain.exponentialRampToValueAtTime(0.0001, now + (big ? 0.30 : 0.20));
    master.connect(engineCtx.destination);

    const osc = engineCtx.createOscillator();
    const oscGain = engineCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(big ? 105 : 135, now);
    osc.frequency.exponentialRampToValueAtTime(big ? 52 : 72, now + 0.11);
    oscGain.gain.setValueAtTime(big ? 0.45 : 0.32, now);
    oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
    osc.connect(oscGain);
    oscGain.connect(master);

    const noise = engineCtx.createBufferSource();
    noise.buffer = makeNoiseBuffer(big ? 0.24 : 0.16);
    const hp = engineCtx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = big ? 900 : 1250;
    const noiseGain = engineCtx.createGain();
    noiseGain.gain.setValueAtTime(big ? 0.62 : 0.46, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + (big ? 0.20 : 0.13));
    noise.connect(hp);
    hp.connect(noiseGain);
    noiseGain.connect(master);

    osc.start(now);
    osc.stop(now + 0.22);
    noise.start(now);
  }

  function playLogHit(big = false){
    if(!engineCtx) return;
    const now = engineCtx.currentTime;

    // Duller wooden thump with a little crack.
    const master = engineCtx.createGain();
    master.gain.setValueAtTime(big ? 0.27 : 0.18, now);
    master.gain.exponentialRampToValueAtTime(0.0001, now + (big ? 0.34 : 0.24));
    master.connect(engineCtx.destination);

    const low = engineCtx.createOscillator();
    const lowGain = engineCtx.createGain();
    low.type = "sine";
    low.frequency.setValueAtTime(big ? 78 : 96, now);
    low.frequency.exponentialRampToValueAtTime(big ? 46 : 60, now + 0.14);
    lowGain.gain.setValueAtTime(big ? 0.58 : 0.42, now);
    lowGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
    low.connect(lowGain);
    lowGain.connect(master);

    const crack = engineCtx.createBufferSource();
    crack.buffer = makeNoiseBuffer(big ? 0.22 : 0.15);
    const bp = engineCtx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = big ? 520 : 720;
    bp.Q.value = 0.8;
    const crackGain = engineCtx.createGain();
    crackGain.gain.setValueAtTime(big ? 0.44 : 0.32, now);
    crackGain.gain.exponentialRampToValueAtTime(0.0001, now + (big ? 0.19 : 0.12));
    crack.connect(bp);
    bp.connect(crackGain);
    crackGain.connect(master);

    low.start(now);
    low.stop(now + 0.26);
    crack.start(now);
  }


  function playPowerUp(kind = "fuel"){
    if(!engineCtx) return;
    const now = engineCtx.currentTime;

    // Loudness roughly matches the heavy obstacle impacts.
    const master = engineCtx.createGain();
    master.gain.setValueAtTime(0.29, now);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 0.58);
    master.connect(engineCtx.destination);

    const notes = kind === "repair"
      ? [392, 523.25, 659.25, 783.99]
      : [329.63, 440, 554.37, 659.25];

    notes.forEach((freq, index) => {
      const start = now + index * 0.085;
      const stop = start + 0.19;

      const osc = engineCtx.createOscillator();
      const gain = engineCtx.createGain();

      osc.type = index % 2 === 0 ? "square" : "triangle";
      osc.frequency.setValueAtTime(freq, start);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.045, stop);

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.34, start + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, stop);

      osc.connect(gain);
      gain.connect(master);
      osc.start(start);
      osc.stop(stop + 0.02);
    });

    // Small bright "sparkle" at the end.
    const sparkle = engineCtx.createOscillator();
    const sparkleGain = engineCtx.createGain();
    sparkle.type = "sine";
    const sparkleStart = now + 0.30;
    sparkle.frequency.setValueAtTime(kind === "repair" ? 1046.5 : 880, sparkleStart);
    sparkle.frequency.exponentialRampToValueAtTime(
      kind === "repair" ? 1568 : 1318.5,
      sparkleStart + 0.18
    );
    sparkleGain.gain.setValueAtTime(0.0001, sparkleStart);
    sparkleGain.gain.exponentialRampToValueAtTime(0.22, sparkleStart + 0.02);
    sparkleGain.gain.exponentialRampToValueAtTime(0.0001, sparkleStart + 0.20);
    sparkle.connect(sparkleGain);
    sparkleGain.connect(master);
    sparkle.start(sparkleStart);
    sparkle.stop(sparkleStart + 0.22);
  }




  // Separate background-music controller.
  // Put the actual files in the GitHub repository at:
  //   ./menu.mp3
  //   ./game.mp3
  // Music failures never block gameplay or sound effects.
  const MUSIC_VOLUME = 0.36;
  const MASTER_AUDIO_BOOST = 4.0;
  const SFX_MASTER_VOLUME = 4.0;
  const SFX_VOLUME_BOOST = 1.5;

  const MUSIC_TRACKS = {
    menu: "./menu.mp3",
    game: "./game.mp3"
  };

  const menuMusic = new Audio(MUSIC_TRACKS.menu);
  const gameMusic = new Audio(MUSIC_TRACKS.game);

  menuMusic.loop = true;
  gameMusic.loop = true;
  menuMusic.preload = "none";
  gameMusic.preload = "none";
  menuMusic.volume = Math.min(1, MUSIC_VOLUME * 1.5);
  gameMusic.volume = Math.min(1, MUSIC_VOLUME * 1.5);

  let musicUnlocked = false;

  function safeMusicPlay(track){
    if(!track) return;
    const playPromise = track.play();
    if(playPromise && typeof playPromise.catch === "function"){
      playPromise.catch(()=>{});
    }
  }

  function stopMusic(track, rewind=false){
    if(!track) return;
    track.pause();
    if(rewind){
      try{ track.currentTime = 0; }catch(e){}
    }
  }

  function playMenuMusic(){
    stopMusic(gameMusic, false);
    if(musicUnlocked) safeMusicPlay(menuMusic);
  }

  function playGameMusic(restart=false){
    stopMusic(menuMusic, false);
    if(restart){
      try{ gameMusic.currentTime = 0; }catch(e){}
    }
    if(musicUnlocked && !state.paused) safeMusicPlay(gameMusic);
  }

  function pauseGameMusic(){
    stopMusic(gameMusic, false);
  }

  function unlockMusic(){
    musicUnlocked = true;

    if(state.started){
      if(!state.paused) playGameMusic(false);
    }else{
      playMenuMusic();
    }
  }

  // Mobile browsers allow media playback only after a user gesture.
  // The first tap/key unlocks music; afterwards menu/game switching is automatic.
  window.addEventListener("pointerdown", unlockMusic, {once:true, capture:true});
  window.addEventListener("keydown", unlockMusic, {once:true, capture:true});

  function initEngineAudio(){
    if(engineCtx){
      if(engineCtx.state === "suspended") engineCtx.resume();
      return;
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;

    engineCtx = new AudioCtx();

    engineMaster = engineCtx.createGain();
    engineMaster.gain.value = 0.0002;

    // Main engine body: darker and less "rotor-like".
    engineFilter = engineCtx.createBiquadFilter();
    engineFilter.type = "lowpass";
    engineFilter.frequency.value = 650;
    engineFilter.Q.value = 0.55;

    const g1 = engineCtx.createGain();
    const g2 = engineCtx.createGain();
    const g3 = engineCtx.createGain();

    g1.gain.value = 0.42;
    g2.gain.value = 0.20;
    g3.gain.value = 0.09;

    engineOsc1 = engineCtx.createOscillator();
    engineOsc2 = engineCtx.createOscillator();
    engineOsc3 = engineCtx.createOscillator();

    engineOsc1.type = "sawtooth";
    engineOsc2.type = "square";
    engineOsc3.type = "triangle";

    engineOsc1.connect(g1);
    engineOsc2.connect(g2);
    engineOsc3.connect(g3);

    g1.connect(engineFilter);
    g2.connect(engineFilter);
    g3.connect(engineFilter);

    // Extra pulse layer gives the "тарахтение" / individual combustion beats.
    enginePulse = engineCtx.createOscillator();
    enginePulse.type = "square";
    enginePulseGain = engineCtx.createGain();
    enginePulseGain.gain.value = 0.022;
    enginePulse.connect(enginePulseGain);
    enginePulseGain.connect(engineFilter);

    // Mechanical rattle: filtered looped noise, kept quiet under the engine.
    const noiseBuffer = engineCtx.createBuffer(1, engineCtx.sampleRate, engineCtx.sampleRate);
    const noiseData = noiseBuffer.getChannelData(0);
    let smooth = 0;
    for(let i = 0; i < noiseData.length; i++){
      const white = Math.random() * 2 - 1;
      smooth = smooth * 0.82 + white * 0.18;
      noiseData[i] = white * 0.45 + smooth * 0.55;
    }

    engineRattle = engineCtx.createBufferSource();
    engineRattle.buffer = noiseBuffer;
    engineRattle.loop = true;

    engineRattleFilter = engineCtx.createBiquadFilter();
    engineRattleFilter.type = "bandpass";
    engineRattleFilter.frequency.value = 1050;
    engineRattleFilter.Q.value = 0.9;

    engineRattleGain = engineCtx.createGain();
    engineRattleGain.gain.value = 0.013;

    engineRattle.connect(engineRattleFilter);
    engineRattleFilter.connect(engineRattleGain);
    engineRattleGain.connect(engineMaster);

    engineFilter.connect(engineMaster);
    engineMaster.connect(engineCtx.destination);

    engineOsc1.start();
    engineOsc2.start();
    engineOsc3.start();
    enginePulse.start();
    engineRattle.start();

    engineCtx.resume();
  }

  function updateEngineAudio(){
    if(!engineCtx || !engineMaster || !state.started) return;

    const now = engineCtx.currentTime;
    const speedRatio = state.normalSpeed > 0
      ? clamp(state.speed / state.normalSpeed, 0, 1.15)
      : 0;

    // A little higher base pitch removes the "helicopter" feel.
    let baseHz = 58 + speedRatio * 29;
    if(state.low) baseHz *= 0.86;

    engineOsc1.frequency.setTargetAtTime(baseHz, now, 0.04);
    engineOsc2.frequency.setTargetAtTime(baseHz * 1.92, now, 0.04);
    engineOsc3.frequency.setTargetAtTime(baseHz * 2.82, now, 0.04);

    // Combustion pulse: deliberately not perfectly harmonic for roughness.
    enginePulse.frequency.setTargetAtTime(baseHz * 1.04, now, 0.035);

    let cutoff = 560 + speedRatio * 260;
    if(state.currentMud) cutoff -= 120;
    if(state.low) cutoff -= 85;
    engineFilter.frequency.setTargetAtTime(clamp(cutoff, 430, 1050), now, 0.06);

    // More metallic/mechanical chatter under load.
    let rattleFreq = 820 + speedRatio * 430;
    if(state.currentMud) rattleFreq += 140;
    if(state.low) rattleFreq += 100;
    engineRattleFilter.frequency.setTargetAtTime(clamp(rattleFreq, 800, 1800), now, 0.08);

    let rattleGain = 0.010 + speedRatio * 0.012;
    if(state.currentMud) rattleGain += 0.009;
    if(state.low) rattleGain += 0.007;
    engineRattleGain.gain.setTargetAtTime(clamp(rattleGain, 0.006, 0.040), now, 0.07);

    let pulseGain = 0.018 + speedRatio * 0.014;
    if(state.currentMud) pulseGain += 0.006;
    if(state.low) pulseGain += 0.004;
    enginePulseGain.gain.setTargetAtTime(clamp(pulseGain, 0.012, 0.042), now, 0.05);

    let targetGain = 0.055 + speedRatio * 0.063;
    if(state.currentMud) targetGain += 0.020;
    if(state.low) targetGain += 0.013;

    if((state.fuel <= 0 || state.hp <= 0) && state.speed <= 0.02){
      targetGain = 0.0001;
    }

    engineMaster.gain.setTargetAtTime(clamp(targetGain, 0.0001, 0.150), now, 0.08);

  function svgSprite(markup){
    const img=new Image();
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(markup);
    return img;
  }
  // Optimized raster car sprites. Visual-only assets; Niva physics and contact geometry stay unchanged.
  function rasterSprite(base64){
    const img=new Image();
    img.src="data:image/webp;base64,"+base64;
    return img;

  function moveUp(){
    // A broken Niva can coast to a stop, but the player can no longer steer it.
    if(state.currentMud || state.hp<=0 || state.falling) return;
    state.targetLane = clamp(state.targetLane - 1, 0, 2);
  }

  function moveDown(){
    if(state.currentMud || state.hp<=0 || state.falling) return;
    state.targetLane = clamp(state.targetLane + 1, 0, 2);
  }
  function setLowMode(on){
    state.low = on;
    if(on && state.currentMud){
      state.speed += 0.12;
    }
    document.getElementById("lowBtn").classList.toggle("active", state.low);
  }


  function playBeerPowerUp(){
    if(!engineCtx) return;
    if(engineCtx.state === "suspended"){
      engineCtx.resume();
    }
    const now = engineCtx.currentTime;
    const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 659.25];

    notes.forEach((freq, i)=>{
      const osc = engineCtx.createOscillator();
      const gain = engineCtx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(freq, now + i*0.07);

      gain.gain.setValueAtTime(0.0001, now + i*0.07);
      gain.gain.exponentialRampToValueAtTime(0.24, now + i*0.07 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.07 + 0.16);

      osc.connect(gain);
      if(engineMaster) gain.connect(engineMaster);
      else gain.connect(engineCtx.destination);

      osc.start(now + i*0.07);
      osc.stop(now + i*0.07 + 0.18);
    });

    // final sparkle
    const sparkle = engineCtx.createOscillator();
    const sparkleGain = engineCtx.createGain();
    sparkle.type = "sine";
    sparkle.frequency.setValueAtTime(880, now + 0.52);
    sparkleGain.gain.setValueAtTime(0.14, now + 0.52);
    sparkleGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
    sparkle.connect(sparkleGain);
    if(engineMaster) sparkleGain.connect(engineMaster);
    else sparkleGain.connect(engineCtx.destination);
    sparkle.start(now + 0.52);
    sparkle.stop(now + 0.82);
  }

  function startGame(){
    if(state.started) return;

    // Audio starts inside the player's tap.
    initEngineAudio();

    state.started = true;
    playGameMusic(true);
    state.distance = 0;
    state.nextFailureCheckMeters = 100;

      engineMaster.gain.cancelScheduledValues(now);
      engineMaster.gain.setValueAtTime(0.0001, now);
      engineMaster.gain.setTargetAtTime(0.7, now, 0.05);
    }
  }

  function addRoadObject(type, lane, start, length, grouped=false){
    // Independent thinning preserves the mixtures with 20% fewer hazards.
    // Pickups are never included in this reduction.
    if(!grouped && !['fuel','repair','beer','ramp','pit'].includes(type) && Math.random()<0.20) return null;
    const width = length * ROAD_PX_PER_M;
    const object={type, lane, width, worldStart:start, worldEnd:start+length,
      x:carX+218+(start+length/2-state.distance*1000)*ROAD_PX_PER_M,
      nivaLengths:width/CAR_SCREEN_W, variant:randi(0, type.includes('rock')?4:2)};
    if(type==='tree'){
      object.treeScale = 1.42 + Math.random()*0.18;
    }
    objects.push(object);
    return object;
  }
  function generateSection(){
    const start = road.end;
    const difficulty = Math.min(start/6000,1);
    const kinds = ['mud','flood','stones','logs','overgrowth','slalom','mixed','mixed'];
    const choices = kinds.filter(k=>k!==road.previous);
    // Rhythm is constrained, while lengths, lanes and contents remain random.
    // A challenge always ends in a genuine clean recovery section.
    const phase = road.phase===null ? 'light' : road.phase==='challenge' ? (Math.random()<0.5?'rest':'light') :
      road.phase==='rest' ? (Math.random()<0.90?'light':'challenge') :
      road.intense>=2 ? (Math.random()<0.5?'rest':'challenge') : (Math.random()<0.16?'rest':'challenge');
    const kind = phase==='rest'?'rest':choices[randi(0,choices.length)];
    const length = phase==='rest'?rand(50,50):phase==='light'?rand(50,100):rand(170,290);
    const bypassLane=randi(0,3);
    const fullWidthMud=phase==='challenge' && Math.random()<0.28;
    const end = start+length;
    const put = (type,lane,m,len)=>addRoadObject(type,lane,m,len);
    const solid = (lane,m,wood)=>{
      const large = Math.random()<0.18+difficulty*0.24;
      const type = wood ? (large?'biglog':'log') : (large?'bigrock':'rock');
      put(type,lane,m,wood?(large?68:56)/9:(large?83:60)/9);
    };
    const placeRampBefore=(lane,targetStart,chance=1)=>{
      if(Math.random()>=chance) return null;
      // The physical ramp and its sprite are 30% longer than in v1.15.2.
      const rampLength=rand(5.5,7)*1.30;
      const rampStart=targetStart-rampLength-rand(2.5,4);
      if(rampStart<start+4) return null;
      const blocked=objects.some(o=>o.lane===lane &&
        o.worldEnd>rampStart-3 && o.worldStart<targetStart-1);
      return blocked?null:addRoadObject('ramp',lane,rampStart,rampLength,true);
    };
    // Every lane is independent. No reserved safe lane, and biome names only
    // bias the mixture: all four hazard families can coexist in any section.
    for(let lane=0;lane<3;lane++){
      if(phase==='rest') continue;
      // Light sections have a clear lane; challenging ones can use all three.
      if(phase==='light' && lane===bypassLane) continue;
      const mudChance = phase==='light'?0.24:(kind==='mud'?0.90:kind==='flood'?0.70:kind==='mixed'?0.65:0.35);
      if(Math.random()<mudChance && (lane!==bypassLane || fullWidthMud)){
        const mudStart=start+rand(0,30);
        const long = kind==='mud' || Math.random()<0.6;
        const mudLength=Math.min(end-mudStart-20,phase==='light'?rand(25,55):lane===bypassLane?rand(35,65):long?rand(110,235):rand(45,90));
        const mudObject=put('mud',lane,mudStart,mudLength);
        // A ramp may launch the Niva over the beginning of a muddy section.
        if(mudObject) placeRampBefore(lane,mudStart,0.26);
      }
      // Water and solids share a longitudinal slot budget, so they can both
      // sit inside a long mud strip without stacking several impacts in one spot.
      let m=start+rand(20,50);
      while(m<end-30){
        const roll=Math.random();
        const waterChance=kind==='flood'?0.46:kind==='mud'?0.33:0.25;
        if(roll<waterChance){
          const width=Math.min(rand(14,38),end-m-8);
          put('puddle',lane,m,width);
          m+=width+rand(10,23);
        }else{
          const woodChance=kind==='logs'?0.72:kind==='stones'?0.28:0.5;
          const wood=Math.random()<woodChance;
          const dryHere=!objects.some(o=>o.lane===lane && o.type==='mud' &&
            o.worldEnd>m-7 && o.worldStart<m+12);
          const plantChance=kind==='overgrowth'?0.44:kind==='logs'?0.18:0.13;
          if(dryHere && Math.random()<plantChance){
            const bigTree=Math.random()<(kind==='overgrowth'?0.52:0.28);
            put(bigTree?'tree':'bush',lane,m,bigTree?96/9:84/9);
            m+=bigTree?rand(34,52):rand(19,31);
          }else if(wood && Math.random()<0.20){
            const count=randi(2,5);
            const groupStart=m;
            const groupId=start+':'+lane+':'+m;
            // Thin the complete group once, keeping its requested 2–4 members.
            const keep=Math.random()>=0.20;
            const sizes=Array.from({length:count},()=>Math.random()<0.45);
            // Most groups mix both sizes; uniform rows can also occur.
            if(Math.random()<0.8){sizes[0]=false;sizes[count-1]=true;}
            // Some log rows become jumpable set pieces.
            if(keep) placeRampBefore(lane,groupStart,0.32);
            for(let j=0;j<count;j++){
              const type=sizes[j]?'biglog':'log';
              const width=obstacleSpriteSize[type][0]/ROAD_PX_PER_M;
              if(keep){
                addRoadObject(type,lane,m,width,true);
                objects[objects.length-1].logGroup=groupId;
              }
              m+=width+rand(4,9)/ROAD_PX_PER_M;
            }
          }else{
            const count=!wood && phase==='challenge' && Math.random()<0.20?2:1;
            for(let j=0;j<count && m<end-18;j++){
              solid(lane,m,wood);
              m+=rand(12,17);
            }
          }
          m+=rand(25,45)-difficulty*4;
        }
        m+=phase==='light'?rand(75,125):rand(20,40);
      }
    }
    // Rare lane-sized set pieces. A ditch is exactly 1.2 visible Niva lengths.
    // It is never placed in mud or within 25 m after a muddy section.
    if(phase!=='rest' && Math.random()<(phase==='challenge'?0.34:0.14)){
      const lane=randi(0,3);
      const pitLength=CAR_SCREEN_W*1.20/ROAD_PX_PER_M;
      let pitStart=null;
      for(let attempt=0;attempt<28;attempt++){
        const candidate=start+rand(48,Math.max(49,length-pitLength-18));
        const candidateEnd=candidate+pitLength;
        const mudConflict=objects.some(o=>o.lane===lane && o.type==='mud' &&
          candidateEnd>o.worldStart-5 && candidate<o.worldEnd+25);
        if(!mudConflict){pitStart=candidate;break;}
      }
      if(pitStart!==null){
        // More than half of the ditches deliberately have no ramp.
        const hasRamp=Math.random()<0.42;
        const rampLength=rand(5.5,7)*1.30;
        const rampStart=pitStart-rampLength-rand(2.5,4);
        const clearStart=hasRamp?rampStart-5:pitStart-8;
        const clearEnd=pitStart+pitLength+10;
        for(let i=objects.length-1;i>=0;i--){
          const o=objects[i];
          if(o.lane===lane && o.type!=='mud' &&
             o.worldEnd>clearStart && o.worldStart<clearEnd){
            objects.splice(i,1);
          }
        }
        if(hasRamp) addRoadObject('ramp',lane,rampStart,rampLength,true);
        addRoadObject('pit',lane,pitStart,pitLength,true);
      }
    }
    road.phase=phase;
    road.previous=kind;
    road.intense=kind==='rest'?0:road.intense+1;
    road.end=end+rand(20,35);
  }

  function generateRoad(){
    const horizon=state.distance*1000+(W-carX-218)/ROAD_PX_PER_M+120;
    while(road.end<horizon) generateSection();
    // Generate bonuses only after the terrain they will occupy is known.
    for(const type of ['fuel','repair','beer']){
      const key=type==='fuel'?'fuelAt':type==='repair'?'repairAt':'beerAt';
      while(road[key]<road.end-55){
        const target=road[key];
        let best=null;
        // Random candidates, preferring a clear pickup approach over a hazard.
        for(let i=0;i<24;i++){
          const m=target+rand(0,40), lane=randi(0,3);
          let score=rand(0,1);
          for(const o of objects){
            if(o.lane!==lane || o.worldEnd<m-32 || o.worldStart>m+12) continue;
            score+=o.type==='mud'?5:o.type==='puddle'?12:
              (o.type==='pit'||o.type==='ramp')?40:
              (o.type==='fuel'||o.type==='repair'||o.type==='beer')?20:30;
          }
          if(!best || score<best.score) best={m,lane,score};
        }
        addRoadObject(type,best.lane,best.m,48/9);
        // Beer uses three times a normal bonus gap, making it much rarer.
        const ordinaryGap=type==='fuel'?rand(230,380):rand(300,500);
        road[key]=best.m+(type==='beer'?ordinaryGap*3:ordinaryGap);
      }
    }
  }

  function roundedRect(x, y, w, h, r, fillStyle, strokeStyle=null){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    if(fillStyle){
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if(strokeStyle){
      ctx.strokeStyle = strokeStyle;
      ctx.stroke();
    }
  }

  function drawSky(){
    // New long Russian-village panorama.
    // It moves from a dedicated shift tied directly to the Niva's real speed.
    const tileW = 1600;
    const tileH = 320;
    const bgY = 0;
    const farScroll = state.bgShift % tileW;

    // Fallback evening sky while the sprite is loading.
    const skyGrad = ctx.createLinearGradient(0,0,0,320);
    skyGrad.addColorStop(0, "#4f92e5");
    skyGrad.addColorStop(0.58, "#8fbaf0");
    skyGrad.addColorStop(1, "#e9d49d");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,320);

    if(bgVillageSprite.complete){
      for(let x = -farScroll - tileW; x < W + tileW; x += tileW){
        ctx.drawImage(bgVillageSprite, x, bgY, tileW, tileH);
      }
    }

    // Light haze at the contact line with the road layer.
    const haze = ctx.createLinearGradient(0, 270, 0, 326);
    haze.addColorStop(0, "rgba(240,225,190,0)");
    haze.addColorStop(1, "rgba(240,225,190,0.14)");
    ctx.fillStyle = haze;
    ctx.fillRect(0,270,W,56);
  }

  function pitSpriteBox(o){
    const h=76;
    return {w:Math.max(138,o.width+52),h,y:laneCenters[o.lane]+7};
  }

  function drawPitSprite(o,foreground=false){
    if(!ditchSprite.complete) return;
    const box=pitSpriteBox(o);
    ctx.save();
    if(foreground){
      // The near wall is drawn again above the falling car, so the body
      // disappears behind soil instead of floating on top of the road.
      ctx.beginPath();
      ctx.rect(o.x-box.w/2,box.y+5,box.w,box.h/2+12);
      ctx.clip();
    }
    ctx.drawImage(ditchSprite,o.x-box.w/2,box.y-box.h/2,box.w,box.h);
    ctx.restore();
  }

  function drawRoad(){
    // Moving ground underlay with low grass, stones and bushes.
    const underlayW = 1180;
    const underlayH = 330;
    const underlayY = 320;
    const groundScroll = (state.roadShift * 3.78) % underlayW;

    if(groundUnderlaySprite.complete){
      for(let x = -underlayW - groundScroll; x < W + underlayW; x += underlayW){
        ctx.drawImage(groundUnderlaySprite, x, underlayY, underlayW, underlayH);
      }
    } else {
      const baseGrad = ctx.createLinearGradient(0,280,0,640);
      baseGrad.addColorStop(0, "#99724d");
      baseGrad.addColorStop(0.55, "#7f5a3c");
      baseGrad.addColorStop(1, "#69492f");
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 274, W, 330);
    }

    // Three dirt lanes on top of the underlay.
    const laneTileW = 620;
    const laneTileH = 84;
    const laneScroll = (state.roadShift * 5.4) % laneTileW;

    if(roadSprite.complete){
      for(let i=0;i<3;i++){
        const y = laneCenters[i] - 31;
        for(let x = -laneTileW - laneScroll; x < W + laneTileW; x += laneTileW - 8){
          ctx.drawImage(roadSprite, x, y, laneTileW, laneTileH);
        }
      }
    }

    // Subtle lane guidance.
    ctx.strokeStyle = "rgba(245,214,158,.26)";
    ctx.lineWidth = 2;
    ctx.setLineDash([16, 18]);
    for(let i=1;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(0, laneCenters[i] - 36);
      ctx.lineTo(W, laneCenters[i] - 36);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Pixel-art ditch sprites cut lane-sized holes into the road texture.
    for(const o of objects){
      if(o.type!=='pit' || o.x+o.width/2<0 || o.x-o.width/2>W) continue;
      drawPitSprite(o);
    }
  }

  function drawObject(o){

  // Canvas has no native z-index for individual sprites. Depth is therefore
  // determined by the actual on-screen road position, not by a fixed lane
  // number: vegetation below the car is closer to the camera and overlaps it;
  // vegetation above or level with the car stays behind.  currentY is used so
  // the order remains correct throughout a lane-change animation.
  function treeIsForeground(o){
    return o.type === 'tree' && laneCenters[o.lane] > state.currentY + 1;
  }

  function drawTree(o){
    if(!treeSprite.complete) return;
    const y=laneCenters[o.lane];
    const treeScale=o.treeScale || 1.5;
    const tw=144*treeScale;
    const th=216*treeScale;
    ctx.drawImage(treeSprite,o.x-tw/2,y-th+26,tw,th);
  }

  // Bounded pool: effects stay lightweight in mobile browsers.
  const particles=[];
  let particleBudget=0, landingBurst=0;
  let steamBudget=0, rearSmokeBudget=0, frontSmokeBudget=0;
  function wheelSurface(x){
    let surface='dust';
    for(const o of objects){
      if(Math.abs(state.currentY-laneCenters[o.lane])>26) continue;
      if(x<o.x-o.width/2 || x>o.x+o.width/2) continue;
      if(o.type==='puddle') return 'water';
      if(o.type==='mud') surface='mud';
    }
    return surface;
  }
  function emitParticle(x,type,burst=false){
    if(particles.length>=180) return;
    const water=type==='water',dust=type==='dust';
    const life=dust?rand(0.55,0.90):rand(0.4,0.75);
    let contact;
    if(selectedCarId==='niva'){
      contact={x:dust?carX-4:x,y:state.currentY+7};
    }else{
      // Keep dust unchanged. Mud and water are tied to the wheel line of
      // each vehicle sprite.
      const wheelLevel = dust ? 17 : 5;
      contact=carEffectPoint(x-carX-71,wheelLevel);
    }
    particles.push({x:contact.x+rand(-9,9),y:contact.y,
      vx:-rand(dust?20:55,dust?65:160)*(burst?1.3:1),vy:-rand(dust?12:110,dust?35:230)*(burst?1.25:1),
      life,maxLife:life,size:dust?rand(8,13):rand(4,7),type,
      color:water?['#aad5df','#72aabd','#d0e6e9'][randi(0,3)]:
        dust?['#b7a27d','#a88e66','#d0b891'][randi(0,3)]:['#60452e','#795337','#4c3929'][randi(0,3)]});
  }
  function carEffectPoint(dx,dy){
    // Same axle pivot and rotation as the Niva sprite, so damage effects stay
    // attached while the body pitches, jumps or sinks into mud.
    const angle=state.logTilt+state.fallSpin;
    const pivotX=carX+71;
    const pivotY=state.currentY+8+state.mudSink-state.logBump;
    return {
      x:pivotX+dx*Math.cos(angle)-dy*Math.sin(angle),
      y:pivotY+dx*Math.sin(angle)+dy*Math.cos(angle)
    };
  }
  function emitDamageParticle(type){
    if(particles.length>=180 || state.falling) return;
    const front=type!=='exhaustSmoke';
    const source=selectedCarId==='niva'
      ? (front?carEffectPoint(104,-58):carEffectPoint(-141,-8))
      : spriteEffectPoint(front?'hood':'exhaust');
    const steam=type==='steam';
    const engineSmoke=type==='engineSmoke';
    const life=steam?rand(0.8,1.25):engineSmoke?rand(1.15,1.8):rand(0.95,1.55);
    particles.push({
      x:source.x+rand(-4,4),y:source.y+rand(-3,3),
      vx:front?rand(-16,8):-rand(32,58),
      vy:-rand(steam?24:18,steam?43:34),
      life,maxLife:life,size:steam?rand(5,8):engineSmoke?rand(8,12):rand(6,10),
      type,damage:true,
      color:steam?['#e8ece7','#cfd7d4','#f3f1e8'][randi(0,3)]:
        engineSmoke?['#252827','#343634','#171918'][randi(0,3)]:
        ['#242522','#34342f','#171816'][randi(0,3)]
    });
  }
  function spriteEffectPoint(kind){
    const anchors={uaz:{hood:[244,46],exhaust:[88,85]},jimny:{hood:[195,43],exhaust:[95,79]}};
    const source=carCollisionSources[selectedCarId],car=getCurrentCar();
    const placement=carSpritePlacement[selectedCarId],point=anchors[selectedCarId][kind];
    const dx=-146+placement.x+point[0]*car.drawWidth/source.width;
    const dy=-86-placement.lift+point[1]*car.drawHeight/source.height;
    return carEffectPoint(dx,dy);
  }
  function updateDamageParticles(dt){
    if(state.falling){
      steamBudget=rearSmokeBudget=frontSmokeBudget=0;
      return;
    }
    if(state.hp<=0){
      // At 0% the exhaust stops; dense smoke now comes from the engine bay.
      steamBudget=rearSmokeBudget=0;
      frontSmokeBudget+=12*dt;
      while(frontSmokeBudget>=1){emitDamageParticle('engineSmoke');frontSmokeBudget--;}
      return;
    }
    frontSmokeBudget=0;
    if(state.hp<=60){
      // Twice the bonnet steam plus black exhaust smoke.
      steamBudget+=6*dt;
      rearSmokeBudget+=5*dt;
    }else if(state.hp<=80){
      steamBudget+=3*dt;
      rearSmokeBudget=0;
    }else{
      steamBudget=rearSmokeBudget=0;
    }
    while(steamBudget>=1){emitDamageParticle('steam');steamBudget--;}
    while(rearSmokeBudget>=1){emitDamageParticle('exhaustSmoke');rearSmokeBudget--;}
  }
  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.life-=dt;
      if(p.damage){
        p.x+=(p.vx-state.speed*18)*dt;p.y+=p.vy*dt;
        p.vy-=5*dt;p.vx*=Math.exp(-0.8*dt);
      }else{
        p.x+=(p.vx-state.speed*270)*dt;p.y+=p.vy*dt;
        p.vy+=(p.type==='dust'?-8:420)*dt;
      }
      if(p.life<=0 || p.x<-30 || p.y>state.currentY+75 || p.y<-30) particles.splice(i,1);
    }
    updateDamageParticles(dt);
    if(state.speed<=0.05){particleBudget=0;landingBurst=0;return;}
    // No tyre spray while airborne; the landing creates a separate short burst.
    if(state.jumpHeight>7){particleBudget=0;return;}
    const ratio=clamp(state.speed/state.normalSpeed,0,1.2);
    particleBudget+=(state.currentPuddle?100:state.currentMud?65:22)*ratio*dt;
    while(particleBudget>=1){
      const hitbox=getCarHitbox();
      const x=carX+(Math.random()<0.7?(selectedCarId==='niva'?18:hitbox.rearAxle):(selectedCarId==='niva'?124:hitbox.frontAxle));
      emitParticle(x,wheelSurface(x));particleBudget--;
    }
    if(landingBurst){
      for(let i=0;i<landingBurst;i++){
        const hitbox=getCarHitbox();
        const x=carX+(i%2?(selectedCarId==='niva'?18:hitbox.rearAxle):(selectedCarId==='niva'?124:hitbox.frontAxle));emitParticle(x,wheelSurface(x),true);
      }
      landingBurst=0;
    }
  }
  function drawParticles(foreground){
    ctx.save();
    for(const p of particles){
      const particleForeground=p.type!=='dust' && p.type!=='exhaustSmoke';
      if(particleForeground!==foreground) continue;
      const fade=clamp(p.life/p.maxLife,0,1);
      ctx.globalAlpha=fade*(p.type==='dust'?0.58:p.damage?0.72:0.95);
      ctx.fillStyle=p.color;
      const size=p.size*((p.type==='dust'||p.damage)?1+(1-fade)*(p.damage?1.8:1.4):1);
      if(p.type==='dust'||p.damage){
        // Three overlapping lobes form small clouds instead of square specks.
        ctx.beginPath();
        ctx.ellipse(p.x,p.y,size*1.3,size*0.65,0,0,Math.PI*2);
        ctx.ellipse(p.x-size*0.65,p.y-size*0.25,size*0.8,size*0.6,0,0,Math.PI*2);
        ctx.ellipse(p.x+size*0.4,p.y-size*0.45,size*0.7,size*0.65,0,0,Math.PI*2);
        ctx.fill();
      }else{
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-0.45);
        ctx.fillRect(-size/2,-size,size,size*2.1);
        ctx.fillStyle=p.type==='water'?'#e5f5f7':'#b18a61';ctx.fillRect(-size/2,-size,size*0.35,size);
        ctx.restore();

      }
    }
    ctx.restore();
  }

  // Per-car collision geometry in canvas pixels relative to carX.
  // Values follow the measured visible alpha bounds of each enlarged sprite;
  // vehicle characteristics and suspension behaviour remain unchanged.
  const carHitboxes = {
    niva:{bodyFront:218,bodyRear:26,frontAxle:137,rearAxle:24,wheelRadius:22,mudFront:150,treeFront:180,treeRear:105}
  };
  // Source-pixel measurements, before canvas scaling and transparent padding.
  const carCollisionSources = {
    uaz:{width:345,height:115,left:75,right:271,rearWheel:116,frontWheel:222,radius:20},
    jimny:{width:310,height:103,left:86,right:217,rearWheel:114,frontWheel:191,radius:15}
  };
  function getCarHitbox(){
    const source=carCollisionSources[selectedCarId];
    if(!source) return {...carHitboxes.niva,pickupRear:-10,pickupFront:215};
    const car=getCurrentCar(), placement=carSpritePlacement[selectedCarId];
    const scale=car.drawWidth/source.width;
    const origin=-75+placement.x;
    const rear=origin+source.left*scale, front=origin+source.right*scale;
    const rearAxle=origin+source.rearWheel*scale;
    const frontAxle=origin+source.frontWheel*scale;
    return {bodyRear:rear,bodyFront:front,rearAxle,frontAxle,
      wheelRadius:source.radius*scale,mudFront:frontAxle,
      treeRear:rear,treeFront:front,pickupRear:rear,pickupFront:front};
  }
  function solidGeometry(o){
    if(o.type==='ramp') return {half:o.width/2,height:31,ramp:true};
    const size=obstacleSpriteSize[o.type];
    if(!['rock','bigrock','log','biglog'].includes(o.type)) return null;
    return {half:size[0]*(o.type.includes('rock')?0.38:0.42),
      height:o.type.includes('rock')?size[1]-9:size[1]*0.38};
  }

  function updateSuspension(dt){
    const carContact=getCarHitbox();
    if(state.falling){
      state.jumpHeight=0;state.jumpVelocity=0;state.rampJumpTime=0;
      state.rampJumpDuration=(0)*1.15;state.rampJumpWorldStep=(0)*1.15;
      state.bodyLift=0;state.bodyVelocity=0;
      state.fallDepth=Math.min(175,state.fallDepth+230*dt);
      const carFall = getCarStats();
      state.fallSpin=Math.min(carFall.fallLimit,state.fallSpin+carFall.fallSpeed*dt);
      state.logBump=-state.fallDepth;
      return;
    }
    let front=0, rear=0;
    const speedRatio=clamp(state.speed/state.normalSpeed,0,1.15);
    for(const o of objects){
      const geometry=solidGeometry(o);
      if(!geometry) continue;
      o.contactThisStep=false;
      const laneWeight=clamp(1-Math.abs(state.currentY-laneCenters[o.lane])/32,0,1);
      if(laneWeight<=0) continue;
      const big=o.type.startsWith('big'), rock=o.type.includes('rock');
      const radius=geometry.half+carContact.wheelRadius, height=geometry.height;
      const profile=axle=>{
        if(geometry.ramp){
          const t=(axle-(o.x-geometry.half))/(geometry.half*2);
          return t>=0&&t<=1?t*height*laneWeight:0;
        }
        const t=Math.abs(o.x-axle)/radius;
        return t<1?(0.5+0.5*Math.cos(t*Math.PI))*height*laneWeight:0;
      };
      front=Math.max(front,profile(carX+carContact.frontAxle));
      rear=Math.max(rear,profile(carX+carContact.rearAxle));
      // One launch per obstacle, proportional to speed. Slow crawling rolls over it.
      const step=state.speed*4.5;
      const tyreEdge=carX+carContact.frontAxle+carContact.wheelRadius;
      const obstacleLeft=o.x-geometry.half;
      const firstTouch=obstacleLeft-step<=tyreEdge && o.x+geometry.half>=carX+carContact.frontAxle-carContact.wheelRadius;
      if(!o.launched && laneWeight>0.45 && firstTouch){
        o.launched=true;
        o.contactThisStep=state.jumpHeight<3;
        if((geometry.ramp || speedRatio>0.38) && state.jumpHeight<3 && state.jumpVelocity<=15){
          if(geometry.ramp){
            // Ramp range is tied to incoming speed: one Niva body at 30 km/h
            // or less, growing smoothly to 1.5 bodies at 60 km/h.
            // The arc keeps the old 28 px height instead of becoming taller.
            const launchKmh=state.speed/state.normalSpeed*60;
            const bodyLengths=1+clamp((launchKmh-30)/30,0,1)*0.5;
            state.rampJumpDuration=0.72;
            state.rampJumpTime=state.rampJumpDuration;
            state.rampJumpWorldStep=310*bodyLengths/(state.rampJumpDuration*60);
            state.jumpHeight=0.01;
            state.jumpVelocity=0;
          }else{
            state.jumpGravity=900;
            state.jumpVelocity=145*Math.pow(speedRatio,0.85);
          }
          state.pitchVelocity-=speedRatio*(geometry.ramp?0.48:0.32);
        }
      }
    }
    const support=(front+rear)*0.5;
    const pitchTarget=clamp(Math.atan2(rear-front,carContact.frontAxle-carContact.rearAxle),-0.18,0.18);
    state.bodyVelocity+=((support-state.bodyLift)*95-state.bodyVelocity*16)*dt;
    state.bodyLift+=state.bodyVelocity*dt;
    if(state.rampJumpTime>0){
      state.rampJumpTime=Math.max(0,state.rampJumpTime-dt);
      const progress=1-state.rampJumpTime/state.rampJumpDuration;
      state.jumpHeight=Math.sin(progress*Math.PI)*28;
      if(state.rampJumpTime<=0){
        state.jumpHeight=0;
        state.rampJumpDuration=0;
        state.rampJumpWorldStep=0;
        landingBurst=10;
        state.bodyVelocity-=28;
        state.landingSquash=2.2;
      }
    }else if(state.jumpHeight>0 || state.jumpVelocity>0){
      state.jumpVelocity-=state.jumpGravity*dt;
      state.jumpHeight+=state.jumpVelocity*dt;
      if(state.jumpHeight<=0){
        const impact=Math.abs(state.jumpVelocity);
        state.jumpHeight=0;state.jumpVelocity=0;state.jumpGravity=900;
        landingBurst=Math.min(18,Math.round(impact/22));
        state.bodyVelocity-=Math.min(impact*0.22,48);
        state.landingSquash=Math.min(impact/90,3);
      }
    }
    const airborne=state.jumpHeight>2;
    const target=airborne?clamp(-state.jumpVelocity*0.00065,-0.13,0.10):pitchTarget;
    state.pitchVelocity+=((target-state.logTilt)*75-state.pitchVelocity*13)*dt;
    state.logTilt=clamp(state.logTilt+state.pitchVelocity*dt,-0.22,0.22);
    state.bodyLift=clamp(state.bodyLift,-5,28);
    state.landingSquash*=Math.exp(-12*dt);
    state.logBump=state.bodyLift+state.jumpHeight-state.landingSquash;
    state.mudSink+=((state.currentMud?10:0)-state.mudSink)*0.09;
  }

  function drawCar(){
    const y = state.currentY;
    const currentCar = getCurrentCar();
    const carSprite = currentCar.sprite;
    const bob = Math.sin(state.roadShift * 0.11) * 0.65 * (1-clamp(state.jumpHeight/12,0,1));
    // Ground shadow stays on the road while the body rises.
    const air=clamp(state.jumpHeight/55,0,1);
    ctx.save();
    ctx.fillStyle='rgba(12,15,12,'+(state.falling?0.05:(0.22-air*0.12))+')';
    ctx.beginPath();
    ctx.ellipse(carX+76,y+8,100-air*18,10-air*3,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    if(carSprite && carSprite.complete){
      const w = currentCar.drawWidth || 310;
      const h = currentCar.drawHeight || 103;

      const placement = carSpritePlacement[selectedCarId] || carSpritePlacement.niva;
      const drawX = carX - 75 + placement.x;
      const visualLift = placement.lift;
      // During a ditch fall all vehicles use the same wheel-contact pivot as the Niva.
      // The previous offset included the sprite alignment lift of UAZ/Jimny, causing
      // the body to rotate around the wrong point and look like it slides instead of
      // dropping into the pit.
      const fallLift = state.falling ? 0 : visualLift;
      const drawY = y - 78 - fallLift + bob + state.mudSink - state.logBump;

      ctx.save();

      // Rotate around the real axle midpoint.
      // Different vehicles have different sprite proportions, so the ditch
      // animation uses their own wheel coordinates instead of Niva defaults.
      let pivotOffset=86;
      let pivotXOffset=71;
      if(selectedCarId!=='niva' && carCollisionSources[selectedCarId]){
        const src=carCollisionSources[selectedCarId];
        const scaleX=w/src.width;
        const scaleY=h/src.height;
        pivotXOffset=((src.rearWheel+src.frontWheel)*0.5)*scaleX-75;
        pivotOffset=((src.rearWheel+src.frontWheel)*0.5)*scaleY;

        // Jimny has a short wheelbase and a taller cabin. Lower the fall
        // pivot slightly and move it to the real wheel line so it does not
        // rotate around the center of the body.
        const carFall = getCarStats();
        pivotXOffset += carFall.pivotX || 0;
        pivotOffset += carFall.pivotY || 0;
      }
      pivotOffset+=fallLift;

      ctx.translate(carX + pivotXOffset, drawY + pivotOffset);
      ctx.rotate(state.logTilt+state.fallSpin);

      ctx.drawImage(
        carSprite,
        drawX-(carX+pivotXOffset),
        -pivotOffset,
        w,
        h
      );

      ctx.restore();
    }
  }

  function drawMudForeground(){
    if(!state.currentMud || state.mudSink < 1) return;

    const y = state.currentY;
    const alpha = clamp(state.mudSink / 10, 0, 1);

    ctx.save();
    ctx.globalAlpha = 0.45 * alpha;
    ctx.fillStyle = "#65452f";

    // Small foreground patches hide the very bottom of the tyres,
    // creating the impression that the Niva is sitting in the rut.
    ctx.beginPath();
    ctx.ellipse(carX + 12, y + 19, 34, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(carX + 154, y + 19, 37, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawHud(){
    // background panels
    const y = 640;
    panel(0, y, 280, 80);
    panel(290, y, 300, 80);
    panel(600, y, 180, 80);
    panel(790, y, 220, 80);
    panel(1020, y, 260, 80);

    ctx.fillStyle = "#f5f8fc";
    ctx.font = "bold 17px monospace";
    ctx.fillText("ТОПЛИВО", 26, 664);
    ctx.fillText("ПРОЧНОСТЬ", 316, 664);
    ctx.fillText("РЕКОРД", 612, 664);
    ctx.fillText("ДИСТАНЦИЯ", 816, 664);
    ctx.fillText("СКОРОСТЬ", 1048, 664);

    const fuelLow = state.fuel > 0 && state.fuel <= 1;
    const fuelBlink = fuelLow && Math.floor(performance.now() / 320) % 2 === 0;
    const fuelColor = state.fuel <= 0 ? "#e55d4d" : (fuelLow ? (fuelBlink ? "#ff5b45" : "#ffb13b") : "#88dd67");

    drawBar(26, 678, 168, 16, state.fuel / state.fuelMax, fuelColor);
    ctx.fillStyle = fuelLow && fuelBlink ? "#ff6b57" : (state.fuel <= 0 ? "#ff6b57" : "#f5f8fc");
    ctx.font = "bold 20px monospace";
    ctx.fillText(Math.ceil(state.fuel)+"/"+state.fuelMax, 206, 692);

    const hpLow = state.hp > 0 && state.hp <= 20;
    const hpBlink = hpLow && Math.floor(performance.now() / 320) % 2 === 0;
    const hpColor = state.hp <= 0 ? "#e55d4d" : (hpLow ? (hpBlink ? "#ff5b45" : "#ffb13b") : "#88dd67");

    drawBar(316, 678, 190, 16, state.hp / 100, hpColor);
    ctx.fillStyle = hpLow && hpBlink ? "#ff6b57" : (state.hp <= 0 ? "#ff6b57" : "#f5f8fc");
    ctx.fillText(Math.floor(state.hp)+"%", 520, 692);

    ctx.fillStyle = "#ffd34d";

    ctx.fillStyle = "#f5f8fc";
    ctx.fillText(bestDistance.toFixed(1)+" км", 612, 692);

    ctx.fillStyle = "#f5f8fc";
    ctx.fillText(state.distance.toFixed(1)+" км", 816, 692);

    ctx.fillStyle = "#f5f8fc";
    ctx.fillText(Math.round(state.displaySpeed) + " км/ч", 1048, 692);
  }

  function drawFuelEmptyOverlay(){
    if(state.fuel > 0) return;

    const stopped = state.speed <= 0.015;
    const boxW = 430;
    const boxH = 62;
    const boxX = (W - boxW) / 2;
    const boxY = 86;

    ctx.save();

    ctx.textAlign = "center";

  function drawBreakdownOverlay(){
    if(state.hp > 0) return;

    chooseFailureReason();

    const hasDetail = !!state.failureDetail;

    const boxH = hasDetail ? 96 : 62;

    const boxY = state.fuel <= 0 ? 158 : 86;

  function panel(x,y,w,h){
    const g = ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0, "#2c3540");
    g.addColorStop(1, "#1f2730");
    roundedRect(x, y, w, h, 12, g);
    ctx.strokeStyle = "#5d6978";
    ctx.lineWidth = 2;
    roundedRect(x+1, y+1, w-2, h-2, 11, null, "#5d6978");
  }

  function drawBar(x,y,w,h,p,color){
    roundedRect(x,y,w,h,5,"#13181e");
    const n = 10, gap = 3, inner = w - 6;
    const segW = (inner - gap*(n-1)) / n;
    const fill = Math.round(clamp(p,0,1)*n);
    for(let i=0;i<n;i++){
      ctx.fillStyle = i < fill ? color : "#34404c";
      ctx.fillRect(x+3+i*(segW+gap), y+3, segW, h-6);
    }
  }

  function checkDistanceFailure(){
    const metres=state.distance*1000;
    while(state.hp>0 && metres+1e-8>=state.nextFailureCheckMeters){
      state.nextFailureCheckMeters+=100;
      if(Math.random()<getCarStats().failureChance){
        state.hp=0;
        chooseFailureReason();
        state.failureDetail='внезапная поломка в пути';
      }
    }
  }

  function obstacleSpeedCap(oldKmh){
    const base=state.low?1.30:1.95;
    return base-Math.max(0,base-oldKmh/60*1.95)*0.70;
  }

  function update(){
    if(!state.started){
      state.low = false;
      return;
    }
    const carContact=getCarHitbox();

    // detect terrain
    state.currentMud = false;
    state.currentPuddle = false;
    state.currentLog = false;
    state.currentBigLog = false;
    state.currentRock = false;
    state.currentBigRock = false;
    const targetY=laneCenters[state.targetLane];
    if(!state.currentMud || Math.abs(targetY-state.currentY)>1.5){
      state.currentY+=(targetY-state.currentY)*0.10;
    }
    if(Math.abs(targetY-state.currentY)<=1.5) state.currentY=targetY;
    // Launch uses incoming speed, before the impact slowdown.
    updateSuspension(1/60);

    for(let i=objects.length-1;i>=0;i--){
      const o = objects[i];
      const sameLane = Math.abs(state.currentY-laneCenters[o.lane])<=26;

      const carFront = carX + carContact.bodyFront;
      const carRear = carX + carContact.bodyRear;

      const solid=solidGeometry(o);
      // Vegetation uses its visible solid part, not the transparent sprite box:
      // a tree only kills on contact with the narrow trunk.
      const vegetationHalf=o.type==='tree'?11:o.type==='bush'?36:null;
      const objHalfW=solid?solid.half:vegetationHalf??(o.width||48)/2;

      const objLeft = o.x - objHalfW;
      const objRight = o.x + objHalfW;

      // A ditch is fatal only when a wheel reaches the opening close to the
      // road surface. A Niva launched high enough by a ramp flies over it.
      if(o.type==='pit' && sameLane && !state.falling && state.hp>0){
        const frontWheel=carX + carContact.frontAxle;
        if(frontWheel>objLeft+4 && frontWheel<objRight-4 && state.jumpHeight<13){
          state.falling=true;
          state.fallDepth=0;
          state.fallSpin=0;
          state.fallPit=o;
          state.hp=0;
          state.failureReason='УЛЕТЕЛ В КАНАВУ';
          state.failureDetail=null;
          state.jumpHeight=0;
          state.jumpVelocity=0;
          state.pitchVelocity=0;
          playRockHit(true);
          continue;
        }
      }

      const overlapsWideObstacle = carFront > objLeft && carRear < objRight;
      const isPickup=['fuel','repair','beer'].includes(o.type);
      const overlapsPickup = o.x > carX+carContact.pickupRear && o.x < carX+carContact.pickupFront;

      // Mud starts affecting the Niva only after it has physically entered
      // the selected lane. targetLane changes immediately, but currentY moves
      // there gradually, so this prevents the car from getting "caught" in mud
      // while it is still visually in the neighbouring lane.
      const frontAxleX = carX + carContact.mudFront;
      const touchingMud = o.type === "mud" && carFront > objLeft && frontAxleX < objRight;
      const mudLaneEntered = o.type === "mud"
        && Math.abs(state.currentY - laneCenters[o.lane]) <= 26;

      const tyreOverlap=carX+carContact.frontAxle+carContact.wheelRadius>objLeft &&
        carX+carContact.rearAxle-carContact.wheelRadius<objRight;
      const activeOverlap = solid
        ? (o.contactThisStep || (state.jumpHeight<3 && tyreOverlap))
        : o.type === "mud" ? (touchingMud && mudLaneEntered && state.jumpHeight<6) : overlapsWideObstacle;

      // The bonnet enters the trunk before the fatal stop. The rear bound
      // prevents a tree already behind the car from triggering a collision.
      const treeImpact=o.type==='tree' && o.x-vegetationHalf<=carX+carContact.treeFront &&
        o.x+vegetationHalf>=carX+carContact.treeRear;

      const overlapsInteraction=isPickup?overlapsPickup:
        o.type==='tree'?treeImpact:activeOverlap;
      if(sameLane && overlapsInteraction){

        if(o.type === "tree" && state.hp>0){
          state.hp=0;
          state.speed=0;
          state.displaySpeed=0;
          state.crashTree=o;
          state.failureReason='РАЗБИЛСЯ НАСМЕРТЬ';
          state.failureDetail=null;
          playRockHit(true);
          continue;
        }

        if(o.type === "bush" && !o.crushed){
          o.crushed=true;
          // The bush gives way, but the branches briefly slow the Niva.
          state.speed=Math.max(0.30,state.speed-4/60*1.95);
          playRockHit(false);
        }

        if(o.type === "fuel" && Math.abs(state.currentY-laneCenters[o.lane])<=26){
          state.fuel = Math.min(state.fuelMax, state.fuel + 1);
          playPowerUp("fuel");
          objects.splice(i,1);
          continue;
        }

        if(o.type === "repair" && Math.abs(state.currentY-laneCenters[o.lane])<=26){
          if(state.hp < 100){
            state.hp = Math.min(100, state.hp + 25);
            playPowerUp("repair");
            objects.splice(i,1);
            continue;
          }
        }

        if(o.type === "beer" && !state.hasBeer &&
           Math.abs(state.currentY-laneCenters[o.lane])<=26){
          state.hasBeer=true;
          playPowerUp("fuel");
          beerBtn.style.display="flex";
          objects.splice(i,1);
          continue;
        }

        if(o.type === "mud"){
          state.currentMud = true;

          if(!o.soundPlayed){
            
            o.soundPlayed = true;
          }
        }

        if(o.type === "puddle"){
          // The puddle can only affect the Niva when the car is actually
          // in this lane. During a lane change the target lane changes first,
          // but the car body is still moving between lanes.
          const puddleLaneEntered =
            Math.abs(state.currentY - laneCenters[o.lane]) <= 26;

          if(puddleLaneEntered){
            state.currentPuddle = true;

            if(!o.soundPlayed){
              
              o.soundPlayed = true;
            }

            // Each puddle gets exactly one hydrolock roll when the Niva first enters it.
            // Chance: 1 in 30, once per puddle.
            if(!o.hydroChecked){
              o.hydroChecked = true;

              if(state.hp > 0 && Math.random() < getCarStats().hydroChance){
                state.hp = 0;
                state.failureReason = "ГИДРОУДАР";
                state.failureDetail = "лужа оказалась слишком глубокой…";
              }
            }
          }
        }

        if(o.type === "log") state.currentLog = true;
        if(o.type === "biglog") state.currentBigLog = true;
        if(o.type === "rock") state.currentRock = true;
        if(o.type === "bigrock") state.currentBigRock = true;

        // Durability damage is applied once per actual obstacle.
        // Medium log/rock: -1%. Large log/rock: -7%.
        if(
          !o.damageApplied &&
          (o.type === "log" || o.type === "rock" ||
           o.type === "biglog" || o.type === "bigrock")
        ){
          const isBigHit = o.type === "biglog" || o.type === "bigrock";
          const damage = isBigHit ? 7 : 1;
          applyCarDamage(damage);
          o.damageApplied = true;

          // All solid obstacles use the same heavy impact sound.
          playRockHit(true);

          if(state.hp <= 0){
            chooseFailureReason();
          }
        }
      }
    }

    // Speed loss happens once on actual contact.
    if(state.currentLog && !state.wasOnLog){
      state.speed = Math.max(0.35, state.speed - (9 / 60 * 1.95 * 0.70));
    }

    if(state.currentBigLog && !state.wasOnBigLog){
      state.speed = Math.max(0.28, state.speed - (20 / 60 * 1.95 * 0.70));
    }

    if(state.currentRock && !state.wasOnRock){
      state.speed = Math.max(0.35, state.speed - (9 / 60 * 1.95 * 0.70));
    }

    if(state.currentBigRock && !state.wasOnBigRock){
      state.speed = Math.max(0.28, state.speed - (20 / 60 * 1.95 * 0.70));
    }

    state.wasOnLog = state.currentLog;
    state.wasOnBigLog = state.currentBigLog;
    state.wasOnRock = state.currentRock;
    state.wasOnBigRock = state.currentBigRock;

    // speed calculation
    let targetSpeed = state.low ? 1.30 : 1.95;

    if(state.currentMud){
      if(state.low){
        // Пониженная вытягивает машину
        targetSpeed = getCarStats().mudLowKmh / 60 * state.normalSpeed;
      } else {
        // Без пониженной глубокая грязь постепенно останавливает
        targetSpeed = -0.08;
      }
    }

    if(state.currentPuddle){
      // Лужа -5 км/ч
      targetSpeed -= 5 / 60 * 1.95;
    }

    if(state.currentLog){
      // Obstacle speed deficit is reduced by 30% (60 → 46 km/h).
      targetSpeed = Math.min(targetSpeed, obstacleSpeedCap(40));
    }

    if(state.currentBigLog){
      // Большое бревно можно переехать, но оно сильно сбрасывает скорость.
      targetSpeed = Math.min(targetSpeed, obstacleSpeedCap(24));
    }

    if(state.currentRock){
      // Средний камень — та же логика, что у среднего бревна.
      targetSpeed = Math.min(targetSpeed, obstacleSpeedCap(40));
    }

    if(state.currentBigRock){
      // Крупный камень — та же логика, что у большого бревна.
      targetSpeed = Math.min(targetSpeed, obstacleSpeedCap(24));
    }

    let speedResponse = state.currentMud ? 0.030 : 0.045;
    if(state.currentLog || state.currentRock) speedResponse = Math.max(speedResponse, 0.085);
    if(state.currentBigLog || state.currentBigRock) speedResponse = Math.max(speedResponse, 0.120);

    // Empty tank or 0% durability: no engine thrust.
    // The Niva coasts smoothly to a complete stop.
    if(state.fuel <= 0 || state.hp <= 0){
      targetSpeed = 0;
      speedResponse = 0.025;
    }

    state.speed += (targetSpeed - state.speed) * speedResponse;

    const maxSpeed = state.low ? 1.45 : 2.10;
    const minSpeed = (state.fuel <= 0 || state.hp <= 0)
      ? 0.0
      : (state.currentMud && !state.low ? 0.0 : 0.28);
    state.speed = Math.max(minSpeed, Math.min(state.speed, maxSpeed));

    if((state.fuel <= 0 || state.hp <= 0) && state.speed < 0.015){
      state.speed = 0;
    }

    // Speedometer: keep an unrounded internal value.
    // Rounding the state every frame used to create an ~8 km/h dead zone:
    // the needle could stick around 52 instead of returning to 60,
    // and around 8 instead of reaching 0.
    const speedKmh = Math.max(0, state.speed / state.normalSpeed * 60);

    if(state.speed === 0){
      state.displaySpeed = 0;
    } else {
      state.displaySpeed += (speedKmh - state.displaySpeed) * 0.10;

      // Snap tiny residual error at stable cruising speed.
      if(!state.low && !state.currentMud && !state.currentPuddle &&
         !state.currentLog && !state.currentBigLog &&
         !state.currentRock && !state.currentBigRock &&
         Math.abs(state.speed - state.normalSpeed) < 0.01){
        state.displaySpeed = 60;
      }
    }

    state.displaySpeed = Math.max(0, state.displaySpeed);

    updateEngineAudio();

    const baseWorldStep=state.speed*4.5;
    const worldStep=state.rampJumpTime>0
      ? Math.max(baseWorldStep,state.rampJumpWorldStep)
      : baseWorldStep;
    state.roadShift += state.speed * 0.75+(worldStep-baseWorldStep)/5.4;
    state.bgShift += state.speed * 1.12;
    state.distance += state.speed * 0.0005;
    if(state.distance > bestDistance){
      bestDistance = state.distance;
      try{ localStorage.setItem(BEST_DISTANCE_KEY, bestDistance.toFixed(1)); }catch(e){}
    }
    checkDistanceFailure();
    state.fuel = Math.max(0, state.fuel - (state.low ? 0.00115 : 0.00085)*getCarStats().fuelUse);

    // Using low range puts extra load on the drivetrain.
    // Wear is gradual: roughly -1% durability per ~8 seconds of continuous low-range driving at 60 FPS.
    if(state.low && state.speed > 0.05 && state.fuel > 0 && state.hp > 0){
      applyCarDamage(0.002);

      if(state.hp <= 0){
        chooseFailureReason();
      }
    }

    // move world
    for(let i=objects.length-1;i>=0;i--){
      objects[i].x -= worldStep;
      const removeAt = objects[i].width ? -objects[i].width - 200 : -220;
      if(objects[i].x < removeAt){
        objects.splice(i,1);
      }
    }

    generateRoad();
    updateParticles(1/60);

  }

  function render(){
    drawSky();
    drawRoad();
    // Surface first: embedded puddles must remain visible above the mud.
    for(const o of objects){
      if((o.type==='mud' || o.type==='puddle') && o.x-o.width/2<W && o.x+o.width/2>0) drawObject(o);
    }
    // Draw every non-near tree with the road objects.  A fixed "lane 2 is
    // foreground" rule breaks as soon as the car moves to the top lane.
    for(const o of objects){
      if(o.type==='mud' || o.type==='puddle' || (o.type==='tree' && treeIsForeground(o)) || o.x>=W+100) continue;
      drawObject(o);
    }
    drawParticles(false);
    if(state.falling && state.fallPit){
      const o=state.fallPit;
      const box=pitSpriteBox(o);
      // Clip to the dark opening itself, not the rectangular sprite box. Once
      // the Niva descends below this ellipse it is fully hidden by the ground.
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(o.x,box.y-4,Math.max(54,o.width/2-10),25,0,0,Math.PI*2);
      ctx.clip();
      drawCar();
      ctx.restore();
      drawPitSprite(o,true);
    }else{
      drawCar();
    }
    // Only trees genuinely lower on the road than the car are foreground.
    // This also updates continuously while the vehicle changes lanes.
    for(const o of objects){
      if(treeIsForeground(o) && o.x< W+100) drawTree(o);
    }
    if(state.crashTree && treeSprite.complete){
      // A narrow front layer makes the stopped Niva look embedded in the
      // trunk rather than pasted over it.
      const o=state.crashTree;
      const y=laneCenters[o.lane];
      const treeScale = o.treeScale || 1.5;
      const tw = 144 * treeScale;
      const th = 216 * treeScale;
      ctx.save();
      ctx.beginPath();
      ctx.rect(o.x-10,y-82,20,102);
      ctx.clip();
      ctx.drawImage(treeSprite,o.x-tw/2,y-th+26,tw,th);
      ctx.restore();
    }
    drawMudForeground();
    drawParticles(true);
    drawHud();
    drawFuelEmptyOverlay();
    drawBreakdownOverlay();

    updateGameOverActions(performance.now());
    beerBtn.style.display = state.started && state.hasBeer ? "flex" : "none";
    baldezhMessage.style.display = performance.now()<state.baldezhUntil ? "block" : "none";
  }


  function togglePause(){
    state.paused = !state.paused;

    if(pauseBtn){
      pauseBtn.textContent = state.paused ? "▶" : "Ⅱ";
    }

    // Pause/resume race music.
    if(state.paused){
      pauseGameMusic();
    }else if(state.started){
      playGameMusic(false);
    }

    // Stop/resume audio context (engine + all WebAudio effects).
    if(engineCtx){
      if(state.paused){
        engineCtx.suspend();
      }else{
        engineCtx.resume();
      }
    }
  }

  if(pauseBtn){
    pauseBtn.addEventListener("click", togglePause);
  }

  // Fixed simulation steps keep jumps identical on 30/60/120 Hz screens.
  let lastFrame=null, accumulator=0;
  function loop(now){
    if(typeof now==='number'){
      if(lastFrame!==null) accumulator+=Math.min((now-lastFrame)/1000,0.1);
      lastFrame=now;
      if(state.paused) accumulator=0;
      else while(accumulator>=1/60){update();accumulator-=1/60;}
    }
    render();
    requestAnimationFrame(loop);
  }

  // Start menu music as soon as the menu appears.
  // Browsers may block autoplay, so the first user tap retries playback.
  playMenuMusic();

  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden && !state.started && musicUnlocked){
      playMenuMusic();
    }
  });

  render();
  loop();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
        await registration.update();
      } catch (error) {
        console.warn('Service worker update failed:', error);
      }
    });
  }
</script>
</body>
